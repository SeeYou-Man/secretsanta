name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run tests
        run: |
          pytest tests/ -v
          
      - name: Run linting
        run: |
          flake8 . --count --max-line-length=100 --statistics
          
      - name: Run simulation tests
        run: |
          python simulate_assignments.py --count 6
          python simulate_assignments.py --exclude "Person1:Person2" --circle